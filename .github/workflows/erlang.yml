name: Build and test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3.4.11', '28.5', '29.0']
        rebar3: ['3.25.0']
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
        version-type: strict
    - name: Cache rebar3 deps and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
        restore-keys: |
          ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-
    - name: Compile
      run: rebar3 compile
  eunit:
    needs: [build]
    runs-on: ubuntu-24.04
    name: EUnit Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3.4.11', '28.5', '29.0']
        rebar3: ['3.25.0']
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
        version-type: strict
    - name: Cache rebar3 deps and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
        restore-keys: |
          ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-
    - name: Run eunit
      run: rebar3 eunit
  ct:
    needs: [build]
    runs-on: ubuntu-24.04
    name: CT Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3.4.11', '28.5', '29.0']
        rebar3: ['3.25.0']
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
        version-type: strict
    - name: Cache rebar3 deps and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
        restore-keys: |
          ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-
    - name: Run common test
      run: rebar3 ct
    - name: Upload CT logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ct-logs-${{matrix.otp}}
        path: _build/test/logs
  dialyzer:
    runs-on: ubuntu-24.04
    name: Dialyzer Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3.4.11', '28.5', '29.0']
        rebar3: ['3.25.0']
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
        version-type: strict
    - name: Cache rebar3 deps and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
        restore-keys: |
          ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-
    - name: Run dialyzer
      run: rebar3 dialyzer
  xref:
    runs-on: ubuntu-24.04
    name: Xref Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3.4.11', '28.5', '29.0']
        rebar3: ['3.25.0']
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
        version-type: strict
    - name: Cache rebar3 deps and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
        restore-keys: |
          ${{runner.os}}-rebar3-${{matrix.otp}}-${{matrix.rebar3}}-
    - name: Run xref
      run: rebar3 xref
    - name: Generate docs
      run: rebar3 ex_doc
  nova_request_app:
    if: github.ref != 'refs/heads/master'
    needs: [build]
    uses: ./.github/workflows/run_nra.yml
    with:
      branch: ${{ github.head_ref || github.ref_name }}
      repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    secrets: inherit

  release:
    needs: [build, eunit, ct, dialyzer, xref]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
      released: ${{ steps.create.outputs.released || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "tag=${TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Determine version bump
        id: bump
        run: |
          LATEST="${{ steps.latest_tag.outputs.tag }}"
          if [ "$LATEST" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="none"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qiE '^feat(\(.+\))?:'; then
              BUMP="minor"
            elif echo "$msg" | grep -qiE '^fix(\(.+\))?:' && [ "$BUMP" != "minor" ]; then
              BUMP="patch"
            fi
          done <<< "$COMMITS"

          # Default to patch if there are commits but no conventional type matched
          if [ "$BUMP" = "none" ] && [ -n "$COMMITS" ]; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.latest_tag.outputs.tag }}"
          CURRENT="${CURRENT#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.next.outputs.version }}" \
            --title "${{ steps.next.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
          echo "tag=${{ steps.next.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

  hex-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Taure/erlang-ci/.github/workflows/hex-publish.yml@v2.3.2
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag }}
      otp-version: '28.5'
      rebar3-version: '3.28.0'
